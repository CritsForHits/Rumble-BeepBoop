name: Build BeepBoop for Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 plugin
    runs-on: windows-2022

    steps:
      - name: Check out BeepBoop
        uses: actions/checkout@v4

      - name: Check out official OBS plugin build support
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-plugintemplate
          ref: master
          path: .obs-plugintemplate

      - name: Prepare OBS build support files
        shell: pwsh
        run: |
          Copy-Item ".obs-plugintemplate/cmake" "cmake" -Recurse -Force
          Copy-Item ".obs-plugintemplate/buildspec.json" "buildspec.json" -Force

          $spec = Get-Content "buildspec.json" -Raw | ConvertFrom-Json
          $spec.name = "BeepBoop"
          $spec.displayName = "BeepBoop"
          $spec.version = "1.0.0"
          $spec.author = "CritsForHits"
          $spec | ConvertTo-Json -Depth 100 | Set-Content "buildspec.json" -Encoding utf8

      - name: Configure Windows x64 build
        run: >-
          cmake -S . -B build_x64
          -G "Visual Studio 17 2022"
          -A x64
          -DENABLE_FRONTEND_API=ON

      - name: Compile plugin
        run: cmake --build build_x64 --config Release --parallel

      - name: Install plugin files
        run: cmake --install build_x64 --config Release --prefix "${{ github.workspace }}\dist"

      - name: Create downloadable ZIP
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) {
            throw "CMake install did not create the dist directory."
          }
          Compress-Archive -Path "dist\*" -DestinationPath "BeepBoop-Windows-x64.zip" -CompressionLevel Optimal -Force

      - name: Upload Windows plugin
        uses: actions/upload-artifact@v4
        with:
          name: BeepBoop-Windows-x64
          path: BeepBoop-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
